# pxlb.conf -- sample single-pool config (see DESIGN.md section 9)
listen          127.0.0.1:8080
workers         1
backlog         128
reuseport       0
max_conns       4096
max_head        65536
buf_cap         65536
connect_timeout 2000
idle_timeout    30000
balance         weighted-least-connections
health_enabled  1
health_interval 3000
health_timeout  1000
health_ok_threshold 2
health_fail_threshold 3
health_path     /healthz
backend         127.0.0.1:9001 weight=1
backend         127.0.0.1:9002 weight=1
